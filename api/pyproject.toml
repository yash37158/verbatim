[project]
name = "verbatim-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "google-genai>=1.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
  "tenacity>=9.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
